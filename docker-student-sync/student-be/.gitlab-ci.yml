stages:
  - build
  - push
  - deploy

variables:
  IMAGE_BACKEND:        $CI_REGISTRY_IMAGE/backend:$CI_PIPELINE_IID
  IMAGE_BACKEND_LATEST: $CI_REGISTRY_IMAGE/backend:latest

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_BACKEND -t $IMAGE_BACKEND_LATEST ./student-be

push-backend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_BACKEND
    - docker push $IMAGE_BACKEND_LATEST

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_BACKEND &&
        cd /opt/student-sync &&
        export IMAGE_BACKEND=$IMAGE_BACKEND &&
        docker compose up -d --no-build backend &&
        docker image prune -f
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST:8080
