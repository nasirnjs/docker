stages:
  - build
  - push
  - deploy

variables:
  IMAGE_FRONTEND:        $CI_REGISTRY_IMAGE/frontend:$CI_PIPELINE_IID
  IMAGE_FRONTEND_LATEST: $CI_REGISTRY_IMAGE/frontend:latest

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # BACKEND_URL comes from GitLab > Settings > CI/CD > Variables
    - docker build
        --build-arg BACKEND_URL=$BACKEND_URL
        -t $IMAGE_FRONTEND
        -t $IMAGE_FRONTEND_LATEST
        ./student-fe

push-frontend:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_FRONTEND
    - docker push $IMAGE_FRONTEND_LATEST

deploy-frontend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_FRONTEND &&
        cd /opt/student-sync &&
        export IMAGE_FRONTEND=$IMAGE_FRONTEND &&
        docker compose up -d --no-build frontend &&
        docker image prune -f
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST
